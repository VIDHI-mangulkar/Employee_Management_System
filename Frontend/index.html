<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

</head>

<body>

    <div class="container">

        <!-- Header -->

        <header>

            <h1>Employee Management System</h1>

            <p>Manage employee records </p>

        </header>


        <!-- Employee Form -->

        <section class="form-section">

            <h2 id="form-title">Add Employee</h2>

            <form id="employee-form">

                <div class="form-grid">


                    <!-- Employee ID -->

                    <div class="form-group">

                        <label for="employee-id">
                            Employee ID
                        </label>

                        <input
                            type="text"
                            id="employee-id"
                            placeholder="Example: EMP001"
                            required
                        >

                    </div>


                    <!-- Name -->

                    <div class="form-group">

                        <label for="name">
                            Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter employee name"
                            required
                        >

                    </div>


                    <!-- Department -->

                    <div class="form-group">

                        <label for="department">
                            Department
                        </label>

                        <select id="department" required>

                            <option value="">
                                Select Department
                            </option>

                            <option value="IT">
                                IT
                            </option>

                            <option value="HR">
                                HR
                            </option>

                            <option value="Finance">
                                Finance
                            </option>

                            <option value="Marketing">
                                Marketing
                            </option>

                            <option value="Sales">
                                Sales
                            </option>

                            <option value="Engineering">
                                Engineering
                            </option>

                        </select>

                    </div>


                    <!-- Designation -->

                    <div class="form-group">

                        <label for="designation">
                            Designation
                        </label>

                        <input
                            type="text"
                            id="designation"
                            placeholder="Example: Developer"
                            required
                        >

                    </div>


                    <!-- Salary -->

                    <div class="form-group">

                        <label for="salary">
                            Salary
                        </label>

                        <input
                            type="number"
                            id="salary"
                            placeholder="Enter salary"
                            min="1"
                            required
                        >

                    </div>


                    <!-- Contact -->

                    <div class="form-group">

                        <label for="contact">
                            Contact
                        </label>

                        <input
                            type="text"
                            id="contact"
                            placeholder="10 digit mobile number"
                            maxlength="10"
                            required
                        >

                    </div>

                </div>


                <!-- Buttons -->

                <div class="button-group">

                    <button
                        type="submit"
                        id="submit-button"
                    >
                        Add Employee
                    </button>


                    <button
                        type="button"
                        id="cancel-button"
                        class="cancel-button"
                        style="display: none;"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </section>


        <!-- Search Section -->

        <section class="search-section">

            <h2>Employee Records</h2>

            <input
                type="text"
                id="search-input"
                placeholder="Search by Employee ID, name or department..."
            >

        </section>


        <!-- Employee Table -->

        <section class="table-section">

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>Employee ID</th>

                            <th>Name</th>

                            <th>Department</th>

                            <th>Designation</th>

                            <th>Salary</th>

                            <th>Contact</th>

                            <th>Actions</th>

                        </tr>

                    </thead>


                    <tbody id="employee-table-body">

                    </tbody>

                </table>

            </div>


            <p id="no-data">
                No employees found.
            </p>

        </section>

    </div>


    <!-- JavaScript -->

    <script type="module" src="/src/main.js"></script>

</body>

</html>
